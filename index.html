<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>College ERP Login</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0f172a] text-white flex items-center justify-center min-h-screen p-4">
<div class="bg-[#1e293b] p-8 rounded-2xl w-full max-w-md border border-gray-700">
<h1 class="text-2xl font-bold text-center mb-6">🎓 College ERP Login</h1>
<select id="role" class="w-full p-3 rounded-lg bg-[#0f172a] border border-gray-600 mb-3">
<option value="student">Student</option>
<option value="library">Library Department</option>
<option value="hostels">Hostels Department</option>
<option value="sports">Sports Department</option>
<option value="accounts">Accounts Department</option>
<option value="examcell">Examination Cell</option>
<option value="admin">Admin</option>
</select>
<input id="uid" placeholder="User ID Ex: R240211" class="w-full p-3 rounded-lg bg-[#0f172a] border border-gray-600 mb-3">
<input id="pwd" type="password" placeholder="Password" class="w-full p-3 rounded-lg bg-[#0f172a] border border-gray-600 mb-4">
<button onclick="login()" class="w-full bg-blue-600 py-3 rounded-lg font-bold">Login</button>
<p class="text-xs text-gray-400 mt-4 text-center">Student: any ID / any pwd<br>Depts: library/library123, hostels/hostels123, sports/sports123, accounts/accounts123, examcell/examcell123, admin/admin123</p>
</div>
<script>
function login(){
const role=document.getElementById('role').value;
const uid=document.getElementById('uid').value.trim();
const pwd=document.getElementById('pwd').value.trim();
if(!uid) return alert('Enter ID');
const logins={library:'library123',hostels:'hostels123',sports:'sports123',accounts:'accounts123',examcell:'examcell123',admin:'admin123'};
if(role!=='student' && pwd!==logins[role]) return alert('Wrong password');
localStorage.setItem('currentRole',role);
localStorage.setItem('currentID',uid);
if(role==='student') location.href='student.html';
else if(role==='admin') location.href='admin.html';
else location.href='department.html';
}
</script></body></html>
